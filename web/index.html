<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>ma5play — MA-5 WASM Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">▮▮</span> ma5play
    <span class="tag">MA-5 · WASM</span></div>
  <div class="status" id="status">加载核心…</div>
</header>

<main class="layout">
  <!-- ============ 左侧栏：Controls（同 ma2play LeftPane） ============ -->
  <aside class="panel side">
    <div class="panel-title">Controls</div>

    <div class="kv"><span class="k">File</span><span class="v" id="trackName">未加载</span></div>
    <div class="kv"><span class="k">Size</span><span class="v" id="trackSize">—</span></div>
    <div class="kv"><span class="k">Backend</span><span class="v">ma5t (t386 WASM)</span></div>

    <div class="ctl-group">
      <div class="ctl-row">
        <button class="ctl" id="btnPlay" title="播放/暂停">▶</button>
        <button class="ctl" id="btnStop" title="停止">⏹</button>
        <button class="ctl" id="btnLoop" title="循环">↻</button>
      </div>
      <div class="ctl-row vol">
        <button class="ctl small" id="btnMute" title="静音">🔊</button>
        <input type="range" id="vol" min="0" max="100" value="80">
      </div>
      <div class="chips">
        <span class="chip" id="chipMode">—</span>
        <span class="chip" id="chipSpeed">—</span>
        <span class="chip" id="chipState">idle</span>
      </div>
    </div>

    <div class="panel-title small">本机文件</div>
    <label class="btn ghost block" for="fileinput">＋ 打开 MMF 文件</label>
    <input type="file" id="fileinput" accept=".mmf" multiple hidden>
    <div class="drop" id="drop">或拖放 .mmf 到这里</div>
  </aside>

  <!-- ============ 右侧大区 ============ -->
  <section class="right">
    <!-- 顶排：钢琴/示波区 + 通道状态区（通道快照待 worklet 阶段，暂占位） -->
    <div class="toprow">
      <div class="panel scopepanel">
        <div class="panel-title">Scope</div>
        <canvas id="scope" width="640" height="96"></canvas>
      </div>
      <div class="panel statuspanel">
        <div class="panel-title">通道状态 <span class="dim">（48ch 快照待 AudioWorklet 阶段）</span></div>
        <div class="chgrid" id="chGrid"></div>
      </div>
    </div>

    <!-- 底排：文件浏览器 + Log（同 ma2play BottomLeft/BottomRight） -->
    <div class="bottomrow">
      <div class="panel browser">
        <!-- 传输条（同 ma2play SMAF Player header） -->
        <div class="transport">
          <button class="ctl" id="btnPrev" title="上一曲">⏮</button>
          <button class="ctl" id="btnPlay2" title="播放/暂停">▶</button>
          <button class="ctl" id="btnNext" title="下一曲">⏭</button>
          <span class="time" id="timeCur">0:00</span>
          <div class="progress"><div class="bar" id="bar"></div></div>
        </div>
        <!-- 导航 -->
        <div class="navrow">
          <button class="nav" id="navBack" title="后退">‹</button>
          <button class="nav" id="navFwd" title="前进">›</button>
          <button class="nav" id="navUp" title="上一级">⌃</button>
          <div class="crumbs" id="crumbs"></div>
        </div>
        <div class="histrow">
          <span class="dim">历史</span>
          <select id="folderHist"><option value="">(无历史)</option></select>
        </div>
        <ul class="list browserlist" id="fileList"></ul>
      </div>
      <div class="panel logpanel">
        <div class="panel-title">Log</div>
        <div class="log" id="log"></div>
      </div>
    </div>
  </section>
</main>

<footer class="foot">ma5t (t386, DLL bit-exact) compiled by emscripten · 48kHz stereo</footer>

<script src="assets/ma5play.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
